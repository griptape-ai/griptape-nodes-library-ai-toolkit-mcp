[project]
name = "ai-toolkit-mcp"
version = "0.1.0"
description = "MCP server for driving ostris/ai-toolkit LoRA training from Griptape Nodes, Claude, or any MCP client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
ai-toolkit-mcp = "ai_toolkit_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
